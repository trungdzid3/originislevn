<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Redmi Buds 6 Play 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <script src="./three.min.js"></script>
  <script src="./GLTFLoader.js"></script>
  <script>
    (function () {
      'use strict';

      if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
        return;
      }

      var renderer, scene, camera, envRT;
      var root = new THREE.Group();
      var lidNode = null;
      var rafId = 0;
      var isLoaded = false;
      var animationDone = false;
      var readyNotified = false;
      var startMs = 0;
      var pausedAtMs = 0;
      var totalPausedMs = 0;

      var DIST = 4.12;
      var CAM_Y = 1.64;
      var CAM_START_ANG = 0.22;
      var CAM_END_ANG = 0.06;
      var WAIT_MS = 400;
      var OPEN_MS = 1450;
      var TARGET_LID_ROT = -1.66;

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function easeInOutCubic(t) {
        t = clamp(t, 0, 1);
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function getSize() {
        var w = document.documentElement.clientWidth || window.innerWidth || 320;
        var h = document.documentElement.clientHeight || window.innerHeight || 212;
        return { w: Math.max(1, w), h: Math.max(1, h) };
      }

      function updateCameraAngle(ang) {
        camera.position.set(Math.sin(ang) * DIST, CAM_Y, Math.cos(ang) * DIST);
        camera.lookAt(0, 0.16, 0);
      }

      function createEnvironment(targetRenderer) {
        var pmrem = new THREE.PMREMGenerator(targetRenderer);
        if (pmrem.compileEquirectangularShader) {
          pmrem.compileEquirectangularShader();
        }
        var envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0x647080);

        function box(w, h, c, i, pos) {
          var m = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(c).multiplyScalar(i),
              side: THREE.DoubleSide
            })
          );
          m.position.set(pos[0], pos[1], pos[2]);
          m.lookAt(0, 0, 0);
          envScene.add(m);
        }

        box(12, 12, 0xffffff, 1.6, [0, 9, 2]);
        box(6, 8, 0xfffdf8, 2.0, [-6, 5, 6]);
        box(6, 7, 0xd8eaff, 1.5, [7, 3, -4]);
        box(10, 3, 0xf6f9ff, 1.0, [0, 2, 9]);

        var rt = pmrem.fromScene(envScene, 0.04);
        pmrem.dispose();
        return rt;
      }

      function createContactShadow() {
        var sc = document.createElement('canvas');
        sc.width = 256;
        sc.height = 256;
        var sctx = sc.getContext('2d');
        var sg = sctx.createRadialGradient(128, 128, 10, 128, 128, 120);
        sg.addColorStop(0, 'rgba(0,0,0,0.22)');
        sg.addColorStop(0.5, 'rgba(0,0,0,0.08)');
        sg.addColorStop(1, 'rgba(0,0,0,0)');
        sctx.fillStyle = sg;
        sctx.fillRect(0, 0, 256, 256);

        var shadow = new THREE.Mesh(
          new THREE.PlaneGeometry(2.1, 2.1),
          new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(sc),
            transparent: true,
            depthWrite: false
          })
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = -0.58;
        return shadow;
      }

      function onResize() {
        if (!renderer || !camera) return;
        var sz = getSize();
        camera.aspect = sz.w / sz.h;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
        renderer.setSize(sz.w, sz.h);
        if (isLoaded && (document.hidden || animationDone)) {
          renderer.render(scene, camera);
        }
      }

      function renderFrame(nowMs) {
        if (!isLoaded) return;

        var elapsed = Math.max(0, nowMs - startMs - totalPausedMs);
        var openProgress = 0;
        if (elapsed > WAIT_MS) {
          openProgress = easeInOutCubic((elapsed - WAIT_MS) / OPEN_MS);
        }

        if (lidNode) {
          lidNode.rotation.x = TARGET_LID_ROT * openProgress;
        }
        var camAng = CAM_START_ANG + (CAM_END_ANG - CAM_START_ANG) * openProgress;
        updateCameraAngle(camAng);

        root.position.y = 0;
        renderer.render(scene, camera);

        if (!readyNotified) {
          readyNotified = true;
          if (window.AndroidBridge && typeof window.AndroidBridge.onReady === 'function') {
            window.AndroidBridge.onReady();
          }
        }

        if (elapsed >= WAIT_MS + OPEN_MS) {
          animationDone = true;
          stopLoop();
        }
      }

      function loop(nowMs) {
        if (document.hidden || animationDone) {
          rafId = 0;
          return;
        }
        rafId = window.requestAnimationFrame(loop);
        try {
          renderFrame(nowMs);
        } catch (err) {
          if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
          }
        }
      }

      function startLoop() {
        if (rafId || document.hidden || !isLoaded || animationDone) return;
        rafId = window.requestAnimationFrame(loop);
      }

      function stopLoop() {
        if (rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }

      function onVisibilityChange() {
        var now = performance.now();
        if (document.hidden) {
          pausedAtMs = now;
          stopLoop();
        } else {
          if (pausedAtMs > 0) {
            totalPausedMs += Math.max(0, now - pausedAtMs);
            pausedAtMs = 0;
          }
          startLoop();
        }
      }

      function init() {
        var sz = getSize();

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
        renderer.setSize(sz.w, sz.h);
        renderer.setClearColor(0x000000, 0);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.96;
        renderer.physicallyCorrectLights = true;
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        envRT = createEnvironment(renderer);
        scene.environment = envRT.texture;

        scene.add(new THREE.HemisphereLight(0xf6f9ff, 0x5c697a, 0.65));
        var key = new THREE.DirectionalLight(0xffffff, 1.35);
        key.position.set(-3, 5.5, 5);
        scene.add(key);

        var fill = new THREE.DirectionalLight(0xdbe8ff, 0.55);
        fill.position.set(4, 2.5, 4);
        scene.add(fill);

        var rim = new THREE.DirectionalLight(0xcfe2ff, 0.85);
        rim.position.set(2, 4, -5);
        scene.add(rim);

        camera = new THREE.PerspectiveCamera(32, sz.w / sz.h, 0.1, 100);
        updateCameraAngle(CAM_START_ANG);

        scene.add(createContactShadow());
        scene.add(root);

        var ledDot = new THREE.Mesh(
          new THREE.SphereGeometry(0.020, 16, 16),
          new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 2.2
          })
        );
        ledDot.position.set(0, -0.22, 0.652);
        root.add(ledDot);

        new THREE.GLTFLoader().load('./redmi_base_fixed.glb', function (gltf) {
          gltf.scene.traverse(function (o) {
            if (o.name === 'RedmiLid') {
              lidNode = o;
            }
            if (o.isMesh) {
              o.material = new THREE.MeshPhysicalMaterial({
                vertexColors: true,
                roughness: 0.38,
                metalness: 0.02,
                envMapIntensity: 0.52,
                clearcoat: 0.24,
                clearcoatRoughness: 0.30
              });
            }
          });

          if (lidNode) {
            var rc = document.createElement('canvas');
            rc.width = 256;
            rc.height = 96;
            var rctx = rc.getContext('2d');
            rctx.font = "600 54px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
            rctx.fillStyle = 'rgba(105, 126, 148, 0.50)';
            rctx.textAlign = 'center';
            rctx.textBaseline = 'middle';
            rctx.fillText('Redmi', 128, 48);

            var redmiDecal = new THREE.Mesh(
              new THREE.PlaneGeometry(0.50, 0.18),
              new THREE.MeshBasicMaterial({
                map: new THREE.CanvasTexture(rc),
                transparent: true,
                depthWrite: false
              })
            );
            redmiDecal.rotation.x = -Math.PI / 2;
            redmiDecal.position.set(0, 0.312, -lidNode.position.z + 0.02);
            lidNode.add(redmiDecal);
            lidNode.rotation.x = 0;
          }

          root.add(gltf.scene);
          isLoaded = true;
          startMs = performance.now();
          renderFrame(startMs);
          startLoop();
        });

        window.addEventListener('resize', onResize, false);
        if (typeof ResizeObserver !== 'undefined') {
          new ResizeObserver(onResize).observe(document.body);
        }
        document.addEventListener('visibilitychange', onVisibilityChange, false);
      }

      try {
        init();
      } catch (e) {
        // Silent fallback when WebGL is unavailable in overlay host
      }
    })();
  </script>
</body>
</html>
